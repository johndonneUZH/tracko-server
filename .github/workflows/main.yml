name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync env vars and trigger deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_URL: ${{ secrets.GEMINI_API_URL }}
        run: |
          set -euo pipefail

          for key in MONGO_DB_URI MONGO_DB_NAME JWT_SECRET GEMINI_API_KEY GEMINI_API_URL; do
            echo "Updating $key..."
            curl -fsS -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg v "${!key}" '{value: $v}')" >/dev/null
          done

          echo "Triggering deploy..."
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' >/dev/null

          echo "Done."
